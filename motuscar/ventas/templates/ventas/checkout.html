{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Motuscar</title>

  <!-- APLICA TEMA GUARDADO (sin botón) -->
  <script>
  (function () {
    var MODE = localStorage.getItem('motus_theme') || 'system';
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var finalMode = (MODE === 'system') ? (prefersDark ? 'dark' : 'light') : MODE;
    document.documentElement.setAttribute('data-theme', finalMode);
  })();
  </script>

  <link rel="stylesheet" href="{% static 'ventas/css/styles.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ====== TEMA OSCURO (tus estilos originales) ====== */
    body{background:#0b1220;color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial}
    .wrap{max-width:1100px;margin:24px auto;padding:0 16px}
    .grid{display:grid;grid-template-columns:1fr 360px;gap:24px}
    .card{background:#111827;border:1px solid #2a3345;border-radius:14px}
    .card h2{margin:0;padding:16px;border-bottom:1px solid #2a3345;font-size:18px}
    .card .body{padding:16px}
    .items{display:flex;flex-direction:column;gap:12px}
    .item{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid #252f40;border-radius:12px;background:#0f172a}
    .thumb{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,255,255,.06)}
    .name{font-weight:700}
    .sku{font-size:12px;color:#9ca3af}
    .line-right{text-align:right}
    .muted{color:#9ca3af}
    .sum-row{display:flex;justify-content:space-between;margin:8px 0}
    .sum-row .v{font-weight:800}
    .total{font-size:20px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:10px;border:1px solid #f97316;background:#f97316;color:#111;font-weight:800;cursor:pointer;width:100%}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    .btn-dark{background:#0b1220;border-color:#2a3345;color:#e5e7eb}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    label{font-size:13px;margin-bottom:4px;display:block}
    input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #2a3345;background:#0b1220;color:#e5e7eb}
    .terms{display:flex; align-items:flex-start; justify-content:flex-start; gap:10px; margin-top:8px; width:100%;}
    .terms input[type="checkbox"]{ width:auto; min-width:auto; height:auto; margin:2px 0 0 0; }
    .empty{padding:24px;border:1px dashed #374151;border-radius:12px;background:#0f172a;color:#9ca3af}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .topbar a{color:#e5e7eb;text-decoration:none}
    .topbar a:hover{text-decoration:underline;color:#f97316}
    @media(max-width:960px){ .grid{grid-template-columns:1fr} }
    /* FIX radios: no hereden width:100% */
    #checkoutForm input[type="radio"]{ width:auto; min-width:0; height:auto; margin:2px 0 0 0; }
    #checkoutForm .row > label{ display:flex; align-items:center; gap:10px; }

    /* ====== OVERRIDES PARA TEMA CLARO ======
       No tocamos tus reglas: solo sobreescribimos cuando data-theme="light" */
    :root[data-theme="light"] body{ background:#f8fafc; color:#0f172a; }
    :root[data-theme="light"] .card{ background:#ffffff; border-color:#e5e7eb; }
    :root[data-theme="light"] .card h2{ border-color:#e5e7eb; color:#0f172a; }
    :root[data-theme="light"] .card .body{ color:#0f172a; }
    :root[data-theme="light"] .item{ background:#ffffff; border-color:#e5e7eb; }
    :root[data-theme="light"] .thumb{ border-color:rgba(0,0,0,.06); }
    :root[data-theme="light"] .sku,
    :root[data-theme="light"] .muted{ color:#6b7280; }
    :root[data-theme="light"] .btn-dark{ background:#ffffff; border-color:#e5e7eb; color:#0f172a; }
    :root[data-theme="light"] input,
    :root[data-theme="light"] select,
    :root[data-theme="light"] textarea{
      background:#ffffff; color:#0f172a; border-color:#e5e7eb;
    }
    :root[data-theme="light"] .empty{ background:#ffffff; color:#6b7280; border-color:#e5e7eb; }
    :root[data-theme="light"] .topbar a{ color:#0f172a; }
    :root[data-theme="light"] .topbar a:hover{ color:#c2410c; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="{% url 'ventas:carrito' %}"><i class="fa-solid fa-angle-left"></i> Volver al carrito</a>
      
    </div>

    <div class="grid">
      <!-- Columna izquierda: Datos -->
      <section class="card">
        <h2>Datos de contacto y envío</h2>
        <div class="body">
          <form id="checkoutForm" method="post" action="{% url 'ventas:webpay_init' %}">
            {% csrf_token %}

            <div class="row">
              <div>
                <label for="nombre">Nombre y apellido</label>
                <input id="nombre" name="nombre" autocomplete="name" required>
              </div>
              <div>
                <label for="rut">RUT</label>
                <input id="rut" name="rut" placeholder="12.345.678-9" required>
              </div>
            </div>

            <div class="row">
              <div>
                <label for="email">Correo</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
              </div>
              <div>
                <label for="fono">Teléfono</label>
                <input id="fono" name="fono" type="tel" placeholder="+56 9 XXXXXXXX" required>
              </div>
            </div>

            <div class="body" style="padding:0;margin:12px 0">
              <label>Método de entrega</label>
              <div class="row">
                <label style="display:flex;gap:8px;align-items:center">
                  <input type="radio" name="envio" value="retiro" checked> Retiro en tienda
                </label>
                <label style="display:flex;gap:8px;align-items:center">
                  <input type="radio" name="envio" value="despacho"> Despacho a domicilio
                </label>
              </div>
            </div>

            <div id="addrBlock">
              <div class="row">
                <div>
                  <label for="region">Región</label>
                  <select id="region" name="region">
                    <option value="">Selecciona…</option>
                    {% for r in regiones %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
                  </select>
                </div>
                <div>
                  <label for="comuna">Comuna</label>
                  <input id="comuna" name="comuna">
                </div>
              </div>
              <div class="row">
                <div>
                  <label for="direccion">Dirección</label>
                  <input id="direccion" name="direccion" placeholder="Calle, número, depto">
                </div>
                <div>
                  <label for="referencias">Referencia (opcional)</label>
                  <input id="referencias" name="referencias" placeholder="Entre calles, portón, etc.">
                </div>
              </div>
            </div>

            <div style="margin-top:8px">
              <label for="comentarios">Comentarios para el pedido (opcional)</label>
              <textarea id="comentarios" name="comentarios" rows="3"></textarea>
            </div>

            <label class="terms">
              <input type="checkbox" id="terms">
              <span>Acepto los <a href="#" target="_blank">términos y condiciones</a> y las políticas de privacidad.</span>
            </label>

            <!-- Campos ocultos con el carrito -->
            <input type="hidden" name="cart_json" id="cart_json">
            <input type="hidden" name="order_total" id="order_total">

            <div style="margin-top:14px">
              <button id="btnPay" class="btn" disabled>
                <i class="fa-brands fa-cc-mastercard"></i> Pagar con Webpay
              </button>
              <button type="button" id="btnBackCart" class="btn btn-dark" style="margin-top:8px"
                      onclick="window.location.href='{% url 'ventas:carrito' %}'">
                <i class="fa-solid fa-cart-shopping"></i> Volver al carrito
              </button>
            </div>
          </form>
        </div>
      </section>

      <!-- Columna derecha: Resumen -->
      <aside class="card">
        <h2>Resumen de compra</h2>
        <div class="body">
          <div id="items" class="items"></div>

          <div id="empty" class="empty" hidden>
            Tu carrito está vacío. <a href="{% url 'ventas:home' %}">Seguir comprando</a>.
          </div>

          <hr style="border-color:#2a3345;border-top:none;margin:12px 0">

          <div class="sum-row"><span class="muted">Subtotal</span><span class="v" id="sumSubtotal">$ 0</span></div>
          <div class="sum-row"><span class="muted">Envío</span><span class="v" id="sumEnvio">$ 0</span></div>
          <div class="sum-row total"><span>Total</span><span class="v" id="sumTotal">$ 0</span></div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    (function(){
      const KEY = "motuscar_cart";
      const nf  = new Intl.NumberFormat("es-CL");
      const itemsEl = document.getElementById("items");
      const emptyEl = document.getElementById("empty");
      const sumSubtotal = document.getElementById("sumSubtotal");
      const sumEnvio    = document.getElementById("sumEnvio");
      const sumTotal    = document.getElementById("sumTotal");
      const form        = document.getElementById("checkoutForm");
      const btnPay      = document.getElementById("btnPay");
      const terms       = document.getElementById("terms");
      const addrBlock   = document.getElementById("addrBlock");
      const cartInput   = document.getElementById("cart_json");
      const totalInput  = document.getElementById("order_total");

      const placeholder = "{% static 'ventas/img/placeholder-product.png' %}";
      const cart = JSON.parse(localStorage.getItem(KEY) || "[]");

      function calcTotals(list){
        const subtotal = list.reduce((a,x)=> a + (Number(x.price||0) * Number(x.qty||0)), 0);
        const envio = list.length ? 0 : 0; // ajusta si cobras envío
        return { subtotal, envio, total: subtotal + envio };
      }

      function render(){
        itemsEl.innerHTML = "";
        if(!cart.length){
          emptyEl.hidden = false;
          btnPay.disabled = true;
          sumSubtotal.textContent = "$ 0";
          sumEnvio.textContent    = "$ 0";
          sumTotal.textContent    = "$ 0";
          return;
        }
        emptyEl.hidden = true;

        cart.forEach(p=>{
          const line = document.createElement("div");
          line.className = "item";
          const imgSrc = p.img || placeholder;
          line.innerHTML = `
            <img class="thumb" src="${imgSrc}" alt="${p.name||'Producto'}"
                 onerror="this.onerror=null;this.src='${placeholder}'">
            <div>
              <div class="name">${p.name||"Producto"}</div>
              <div class="sku">SKU ${p.sku||""}</div>
              <div class="muted">Cantidad: ${p.qty||1} × $ ${nf.format(p.price||0)}</div>
            </div>
            <div class="line-right">$ ${nf.format((p.price||0)*(p.qty||0))}</div>
          `;
          itemsEl.appendChild(line);
        });

        const {subtotal, envio, total} = calcTotals(cart);
        sumSubtotal.textContent = "$ " + nf.format(subtotal);
        sumEnvio.textContent    = "$ " + nf.format(envio);
        sumTotal.textContent    = "$ " + nf.format(total);

        // prepara payload para el backend
        cartInput.value  = JSON.stringify(cart);
        totalInput.value = String(total);
        updatePayButton();
      }

      function updatePayButton(){
        const okTerms = terms.checked;
        const hasItems = cart.length > 0;
        btnPay.disabled = !(okTerms && hasItems);
      }

      // Envío: mostrar/ocultar bloque de dirección
      document.querySelectorAll('input[name="envio"]').forEach(r=>{
        r.addEventListener('change', ()=>{
          const v = document.querySelector('input[name="envio"]:checked')?.value;
          addrBlock.style.display = (v === 'despacho') ? '' : 'none';
        });
      });
      terms.addEventListener('change', updatePayButton);

      // Submit: valida que haya items y términos
      form.addEventListener('submit', (e)=>{
        if(cart.length===0 || !terms.checked){
          e.preventDefault();
          updatePayButton();
          alert("Debes aceptar los términos y tener productos en el carrito.");
        }
      });

      // Inicial
      addrBlock.style.display = (document.querySelector('input[name="envio"]:checked')?.value === 'despacho') ? '' : 'none';
      render();
    })();
  </script>
</body>
</html>
