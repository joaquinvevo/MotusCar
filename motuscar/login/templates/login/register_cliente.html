{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Cliente — Motuscar</title>
  <link rel="stylesheet" href="{% static 'login/css/register.css' %}">
</head>
<body>
  <!-- NAVBAR -->
  <header>
    <a href="/"><img src="{% static 'login/imgs/Motuscar_logo.webp' %}" alt="Motuscar" class="logo"></a>
    <a href="{% url 'login:login' %}" class="nav-link">Iniciar sesión</a>
  </header>

  <!-- CONTENIDO -->
  <main class="register-container">
    <div class="register-card">
      <img src="{% static 'login/imgs/cliente_icon.svg' %}" alt="Cliente" class="register-icon">
      <h1>Registro de Cliente</h1>
      <p class="subtitle">Compra repuestos y agenda servicios fácilmente.</p>

      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo" required>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label for="password1">Contraseña</label>
          <input type="password" id="password1" name="password1" placeholder="Crea una contraseña" required>
        </div>

        <div class="form-group">
          <label for="password2">Confirmar contraseña</label>
          <input type="password" id="password2" name="password2" placeholder="Repite tu contraseña" required>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="text" id="telefono" name="telefono" placeholder="Ej: +56 9 8765 4321">
        </div>

        <div class="form-group">
          <label for="direccion">Dirección</label>
          <input type="text" id="direccion" name="direccion" placeholder="Ej: Av. Los Carrera 1234, Concepción">
        </div>

        <button type="submit">Registrarme</button>
      </form>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    © 2025 Motuscar — Todos los derechos reservados
  </footer>
</body>
</html>
